# Netlify build configuration for the Prime Insurances site.
#
# The App Router route handlers under src/app/api/ become Netlify Functions on
# the Node runtime. They must NOT be moved to the Edge runtime: the assessment
# route decodes a legacy Supabase JWT with `Buffer`, which Edge does not provide.

[build]
  # NEXT_PUBLIC_* values are inlined at build time, whereas Netlify's URL /
  # DEPLOY_PRIME_URL are runtime-unreliable inside the server function. So the
  # origin must be resolved HERE and baked in, otherwise every route 500s.
  # `npm ci` (rather than Netlify's automatic `npm install`) makes the committed
  # lockfile authoritative and fails the build on a mismatch.
  command = "npm ci && NEXT_PUBLIC_SITE_URL=\"${NEXT_PUBLIC_SITE_URL:-$URL}\" npm run build"
  publish = ".next"

[build.environment]
  # Next.js 14.2 and @netlify/plugin-nextjs 5 both require Node >= 18.
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Intake endpoints must never be cached: they are POST-only handlers that issue
# a reference per submission.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

# Previews should not be indexed, and should not compete with the production
# origin in search. Handled with a noindex header rather than by rewriting the
# origin: DEPLOY_PRIME_URL is derived from the branch name, and a branch
# containing "/" yields a URL with a path, which fails origin validation and
# breaks the build.
[[context.deploy-preview.headers]]
  for = "/*"
  [context.deploy-preview.headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[context.branch-deploy.headers]]
  for = "/*"
  [context.branch-deploy.headers.values]
    X-Robots-Tag = "noindex, nofollow"
